<!doctype html>
<html><head><meta charset="utf-8"/><style>html,body{margin:0;height:100%;background:#2a2335}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const p = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2335);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xcdb4ff, 0x4a3a63, 1.2));
const key = new THREE.DirectionalLight(0xffe9c8, 2.4); key.position.set(3, 5, 4); scene.add(key);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
const rotY = THREE.MathUtils.degToRad(Number(p.get('rot') || 0));
new GLTFLoader().load(p.get('glb'), (g) => {
  const obj = g.scene; obj.rotation.y = rotY;
  const box = new THREE.Box3().setFromObject(obj); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  obj.position.sub(c); scene.add(obj);
  const r = Math.max(size.x, size.y, size.z) * 0.5; const d = r / Math.tan((cam.fov * Math.PI / 180) / 2) * 1.25;
  cam.position.set(d * 0.55, d * 0.32, d * 0.85); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam); window.__ready = true;
  let t = 0; (function spin(){ renderer.render(scene, cam); t++; if (t < 4) requestAnimationFrame(spin); })();
}, undefined, (e) => { window.__err = String(e); window.__ready = true; });
</script></body></html>
